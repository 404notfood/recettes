<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <title>Relier Cuistot Club</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="popup">
        <h1>Mes drives</h1>
        <button id="open">Ouvrir les 3 drives</button>
        <p>
            Ouvrez Cuistot Club, puis reliez cet onglet. Un seul site peut être
            autorisé à la fois.
        </p>
        <button id="pair">Relier le site de cet onglet</button>
        <p id="status" role="status"></p>
        <button id="disconnect" class="secondary">Déconnecter le site</button>
        <p class="muted">
            Version expérimentale · Chrome / Edge sur ordinateur. Connectez-vous
            aux drives dans leurs propres onglets.
        </p>
        <script src="popup.js" type="module"></script>
    </body>
</html>
